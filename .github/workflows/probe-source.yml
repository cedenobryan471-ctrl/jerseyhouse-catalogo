name: Revisar fuente nueva
on:
  workflow_dispatch:
    inputs:
      secreto:
        description: Secreto con la dirección de la fuente
        type: choice
        options: [FUENTE_NUEVA, FUENTE_NUEVA_2]
        default: FUENTE_NUEVA_2
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow beautifulsoup4
      - name: Revisar (sin publicar la dirección)
        env:
          FUENTE_NUEVA: ${{ secrets[inputs.secreto] }}
          FUENTE: ${{ secrets[inputs.secreto] }}
          CLAVE: ${{ secrets[format('{0}_CLAVE', inputs.secreto)] }}
        run: |
          mkdir -p /tmp/probe
          python scripts/probe_login.py > /tmp/count_login.json || echo '{"login":"error"}' > /tmp/count_login.json
          python scripts/probe_source.py > /tmp/count.json || echo '{"probe":"error"}' > /tmp/count.json
          cat /tmp/count_login.json >> /tmp/count.json
          for f in /tmp/probe/*.json; do
            openssl rand -out /tmp/k.bin 32
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out "${f%.json}.enc" -pass file:/tmp/k.bin
            openssl pkeyutl -encrypt -pubin -inkey .github/claude-pub.pem -in /tmp/k.bin -out "${f%.json}.key"
            rm "$f" /tmp/k.bin
          done
      - name: Guardar resultado cifrado en rama privada-cifrada
        run: |
          mkdir -p /tmp/out && cp /tmp/count.json /tmp/out/ && cp /tmp/probe/*.enc /tmp/probe/*.key /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan muestra-cifrada && git rm -rqf . && cp /tmp/out/* . && git add -A && git commit -qm "Muestra cifrada" && git push -fq origin muestra-cifrada
