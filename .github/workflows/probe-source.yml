name: Revisar fuente nueva
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow beautifulsoup4
      - name: Revisar (sin publicar la dirección)
        env:
          FUENTE_NUEVA: ${{ secrets.FUENTE_NUEVA }}
        run: |
          python scripts/probe_source.py > /tmp/count.json
          cat /tmp/count.json
          if [ -f /tmp/probe/sample.json ]; then
            openssl rand -out /tmp/k.bin 32
            openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/probe/sample.json -out /tmp/probe/sample.enc -pass file:/tmp/k.bin
            openssl pkeyutl -encrypt -pubin -inkey .github/claude-pub.pem -in /tmp/k.bin -out /tmp/probe/key.enc
            rm /tmp/probe/sample.json /tmp/k.bin
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: muestra-cifrada
          path: /tmp/probe/*.enc
          if-no-files-found: ignore
          retention-days: 2
