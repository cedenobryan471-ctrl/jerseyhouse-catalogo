name: Evaluar detector de texto
on: workflow_dispatch
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy rapidocr_onnxruntime
      - run: python scripts/casual_ocr_eval.py
      - run: |
          git config user.name catalog-bot; git config user.email catalog-bot@users.noreply.github.com
          git add casual-ocr-eval.json && git commit -qm "Evaluación del detector de texto" && git pull --rebase -q && git push
