name: Ropa de marca - actualización semanal
on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  start:
    if: github.repository == 'cedenobryan471-ctrl/jerseyhouse-catalogo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poner en cola las fuentes de ropa de marca
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '{"pilot": false, "fuente": "FUENTE_NUEVA", "cola": ["FUENTE_NUEVA_2"], "post": true}' > casual-control.json
          git config user.name catalog-bot; git config user.email catalog-bot@users.noreply.github.com
          git add casual-control.json && git commit -qm "Ropa de marca: inicia actualización semanal" && git push -q
          gh workflow run casual-import.yml --ref main -f continue=true
