name: Revisar fuentes repetidas
on:
  workflow_dispatch:
    inputs:
      hashes:
        type: string
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CATALOG_CONFIG: ${{ secrets.CATALOG_CONFIG }}
          SOURCES_CONFIG: ${{ secrets.SOURCES_CONFIG }}
          FOOTWEAR_SOURCES_CONFIG: ${{ secrets.FOOTWEAR_SOURCES_CONFIG }}
          FUENTE_NUEVA: ${{ secrets.FUENTE_NUEVA }}
          FUENTE_NUEVA_2: ${{ secrets.FUENTE_NUEVA_2 }}
          FUENTE_CALZADO: ${{ secrets.FUENTE_CALZADO }}
          HASHES: ${{ inputs.hashes }}
        run: |
          python scripts/check_known.py > known-result.json
          git config user.name catalog-bot; git config user.email catalog-bot@users.noreply.github.com
          git add known-result.json && git commit -qm "Fuentes repetidas" && git pull --rebase -q && git push -q
