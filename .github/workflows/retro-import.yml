name: Cargar camisetas retro
on:
  push:
    branches: [main]
    paths: ['retro-control.json']
  workflow_dispatch:
    inputs:
      continue:
        description: Seguir con la siguiente tanda al terminar
        type: boolean
        default: true
permissions:
  actions: write
  contents: write
  pages: write
  id-token: write
concurrency:
  group: catalog-update
  cancel-in-progress: false
jobs:
  retro:
    if: github.repository == 'cedenobryan471-ctrl/jerseyhouse-catalogo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -q && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
      - run: pip install requests pillow beautifulsoup4 numpy rapidocr_onnxruntime
      - name: Modo
        id: mode
        run: |
          pilot=$(python -c "import json;print(str(json.load(open('retro-control.json')).get('pilot',True)).lower())")
          echo "pilot=$pilot" >> "$GITHUB_OUTPUT"
      - name: Descargar fotos de galería existentes
        if: steps.mode.outputs.pilot != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p gallery-extra/images
          for attempt in $(seq 1 5); do
            if gh release download gallery-photos --pattern gallery-extra.tar.gz --dir /tmp --clobber; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          tar -xzf /tmp/gallery-extra.tar.gz -C gallery-extra
      - name: Cargar una tanda de retro
        env:
          CATALOG_CONFIG: ${{ secrets.CATALOG_CONFIG }}
          FUENTE_RETRO: ${{ secrets.FUENTE_RETRO }}
          CLAVE: ${{ secrets.FUENTE_RETRO_CLAVE }}
          RETRO_PILOT: ${{ steps.mode.outputs.pilot }}
          RETRO_BATCH: '80'
        run: |
          python scripts/retro_import.py > /dev/null
          if [ "${{ steps.mode.outputs.pilot }}" != true ]; then python scripts/normalize_all.py > /dev/null; fi
      - name: Guardar
        run: |
          git config user.name catalog-bot
          git config user.email catalog-bot@users.noreply.github.com
          if [ "${{ steps.mode.outputs.pilot }}" = true ]; then
            git add retro-result.json; [ -d retro-pilot ] && git add retro-pilot || true
          else
            git add catalog.json images retro-seen.json retro-result.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Cargar camisetas retro por tanda'; git checkout -- . ; git clean -fdq -e gallery-extra || true
            for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; git rebase --abort 2>/dev/null; sleep $((i*15)); done
            git status -sb | head -1 | grep -q ahead && exit 1 || true
          fi
      - name: Publicar fotos de galería
        if: steps.mode.outputs.pilot != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf /tmp/gallery-extra.tar.gz -C gallery-extra images
          for attempt in $(seq 1 5); do
            if gh release upload gallery-photos /tmp/gallery-extra.tar.gz --clobber; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - uses: actions/configure-pages@v5
        if: steps.mode.outputs.pilot != 'true'
      - run: |
          mkdir -p _site
          python3 scripts/build_tienda.py
          cp catalog.json tienda.json tienda-visible.json estado.json resultado.json revisar.json _site/
          if [ -f portadas.json ]; then cp portadas.json _site/; fi
          if [ -f destacados.json ]; then cp destacados.json _site/; fi
          if [ -f revisar-portadas.json ]; then cp revisar-portadas.json _site/; fi
          cp -r images _site/
          touch _site/.nojekyll
        if: steps.mode.outputs.pilot != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.pilot != 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.mode.outputs.pilot != 'true'
      - name: Seguir con la siguiente tanda
        if: steps.mode.outputs.pilot != 'true' && (github.event_name == 'push' || inputs.continue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining=$(python -c "import json;print(json.load(open('retro-result.json'))['remaining'])")
          if [ "$remaining" != 0 ]; then gh workflow run retro-import.yml --ref main -f continue=true; fi
