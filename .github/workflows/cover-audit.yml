name: Revisar todas las portadas
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 0'
permissions:
  contents: write
  actions: write
concurrency:
  group: catalog-update
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow "transformers<5" torch --extra-index-url https://download.pytorch.org/whl/cpu
      - env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p gallery-extra && gh release download gallery-photos --pattern gallery-extra.tar.gz --dir /tmp --clobber && tar -xzf /tmp/gallery-extra.tar.gz -C gallery-extra
      - run: python scripts/cover_audit.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name catalog-bot; git config user.email catalog-bot@users.noreply.github.com
          git add catalog.json images cover-audit.json
          git diff --cached --quiet || (git commit -qm "Revisión semanal de portadas" && for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 30; done)
          gh workflow run catalog-overrides.yml --ref main || true
