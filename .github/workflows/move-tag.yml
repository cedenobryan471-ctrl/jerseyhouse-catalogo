name: Limpiar etiqueta de fotos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/move-tag.yml']
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag -f gallery-photos HEAD
          git push origin refs/tags/gallery-photos --force
