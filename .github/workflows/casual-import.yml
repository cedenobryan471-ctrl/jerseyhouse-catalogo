name: Cargar ropa de marca
on:
  push:
    branches: [main]
    paths: ['casual-control.json']
  workflow_dispatch:
    inputs:
      continue:
        description: Seguir con la siguiente tanda al terminar
        type: boolean
        default: true
permissions:
  actions: write
  contents: write
  pages: write
  id-token: write
concurrency:
  group: catalog-update
  cancel-in-progress: false
jobs:
  casual:
    if: github.repository == 'cedenobryan471-ctrl/jerseyhouse-catalogo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -q && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
      - run: pip install requests pillow beautifulsoup4 numpy rapidocr_onnxruntime
      - name: Modo
        id: mode
        run: |
          pilot=$(python -c "import json;print(str(json.load(open('casual-control.json')).get('pilot',True)).lower())")
          echo "pilot=$pilot" >> "$GITHUB_OUTPUT"
          fuente=$(python -c "import json;print(json.load(open('casual-control.json')).get('fuente','FUENTE_NUEVA'))")
          echo "fuente=$fuente" >> "$GITHUB_OUTPUT"
      - name: Descargar fotos de galería existentes
        if: steps.mode.outputs.pilot != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p gallery-extra/images
          for attempt in $(seq 1 5); do
            if gh release download gallery-photos --pattern gallery-extra.tar.gz --dir /tmp --clobber; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          tar -xzf /tmp/gallery-extra.tar.gz -C gallery-extra
      - name: Cargar una tanda sin IA
        env:
          CATALOG_CONFIG: ${{ secrets.CATALOG_CONFIG }}
          FUENTE_NUEVA: ${{ secrets[steps.mode.outputs.fuente] }}
          CLAVE: ${{ secrets[format('{0}_CLAVE', steps.mode.outputs.fuente)] }}
          CASUAL_PILOT: ${{ steps.mode.outputs.pilot }}
          CASUAL_BATCH: '80'
        run: |
          python scripts/casual_import.py > /dev/null && python scripts/normalize_all.py > /dev/null
      - name: Guardar
        run: |
          git config user.name catalog-bot
          git config user.email catalog-bot@users.noreply.github.com
          if [ "${{ steps.mode.outputs.pilot }}" = true ]; then
            git add casual-result.json casual-pilot || true
          else
            git add catalog.json images casual-seen.json casual-result.json; for f in casual-audience-fixed.json casual-photos-fixed.json; do [ -f "$f" ] && git add "$f"; done; true
          fi
          git diff --cached --quiet || (git commit -m 'Cargar ropa de marca por tanda' && git pull --rebase -q && git push)
      - name: Publicar fotos de galería
        if: steps.mode.outputs.pilot != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf /tmp/gallery-extra.tar.gz -C gallery-extra images
          for attempt in $(seq 1 5); do
            if gh release upload gallery-photos /tmp/gallery-extra.tar.gz --clobber; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - uses: actions/configure-pages@v5
        if: steps.mode.outputs.pilot != 'true'
      - run: |
          mkdir -p _site
          python3 scripts/build_tienda.py
          cp catalog.json tienda.json estado.json resultado.json revisar.json _site/
          if [ -f portadas.json ]; then cp portadas.json _site/; fi
          if [ -f destacados.json ]; then cp destacados.json _site/; fi
          if [ -f revisar-portadas.json ]; then cp revisar-portadas.json _site/; fi
          cp -r images _site/
          touch _site/.nojekyll
        if: steps.mode.outputs.pilot != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.pilot != 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.mode.outputs.pilot != 'true'
      - name: Seguir con la siguiente tanda
        if: steps.mode.outputs.pilot != 'true' && (github.event_name == 'push' || inputs.continue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining=$(python -c "import json;print(json.load(open('casual-result.json'))['remaining'])")
          added=$(python -c "import json;print(json.load(open('casual-result.json'))['added'])")
          if [ "$remaining" != 0 ]; then gh workflow run casual-import.yml --ref main -f continue=true; exit 0; fi
          # Terminó esta fuente: sigue con la próxima de la cola; al final, revisión de portadas y de Mujer.
          next=$(python - <<'PY2'
          import json
          c = json.load(open('casual-control.json'))
          cola = c.get('cola') or []
          if cola:
              c['fuente'] = cola.pop(0); c['cola'] = cola; print('fuente')
          elif c.get('post'):
              c['post'] = False; print('post')
          else:
              print('fin')
          json.dump(c, open('casual-control.json', 'w'))
          PY2
          )
          if [ "$next" != fin ]; then
            git add casual-control.json && git commit -qm "Ropa de marca: siguiente paso de la actualización" && git pull --rebase -q && git push -q
          fi
          if [ "$next" = fuente ]; then gh workflow run casual-import.yml --ref main -f continue=true; fi
          if [ "$next" = post ]; then gh workflow run casual-post.yml --ref main; fi
