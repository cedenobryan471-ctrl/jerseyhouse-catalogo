name: Aplicar estados y portadas
on:
  push:
    paths: ['estado.json', 'portadas.json', 'catalog.json', 'destacados.json', '.github/workflows/catalog-overrides.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: catalog-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p _site
          python3 scripts/build_tienda.py
          cp catalog.json tienda.json estado.json resultado.json revisar.json _site/
          if [ -f portadas.json ]; then cp portadas.json _site/; fi
          if [ -f destacados.json ]; then cp destacados.json _site/; fi
          cp -r images _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
